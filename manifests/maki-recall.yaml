apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: maki-recall-data
  namespace: maki
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: maki-recall
  namespace: maki
  labels:
    app: maki-recall
spec:
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    app: maki-recall
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: maki-recall
  namespace: maki
  labels:
    app: maki-recall
spec:
  replicas: 1
  selector:
    matchLabels:
      app: maki-recall
  template:
    metadata:
      labels:
        app: maki-recall
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: mem0
          image: ghcr.io/adhityaravi/maki-recall:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: POSTGRES_HOST
              value: maki-vault,maki-vault-inu.xantu-city.ts.net,maki-vault-sushi.xantu-city.ts.net,maki-vault-ramen.xantu-city.ts.net
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: maki
            - name: POSTGRES_USER
              value: maki
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: maki-vault-secret
                  key: password
            - name: NEO4J_URI
              value: bolt://maki-graph:7687
            - name: NEO4J_USERNAME
              value: neo4j
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: maki-graph-auth
                  key: password
            - name: OLLAMA_URL
              value: http://maki-embed:11434
            - name: LLM_PROVIDER
              value: openai
            - name: LLM_URL
              value: http://maki-synapse:8080/v1
            - name: LLM_MODEL
              value: claude-sonnet-4-6
            - name: EMBEDDER_MODEL
              value: nomic-embed-text
            - name: EMBEDDING_DIMS
              value: "768"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            # Generous threshold: 6 × 30s = 3min of /health failure before
            # kubelet restarts the pod. Lets transient backend hiccups ride
            # through; only kills genuinely stuck pods.
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            # Bumped from 256Mi/512Mi after #251: mem0 fact-extraction runs
            # the LLM add() path synchronously and accumulates messages +
            # extracted facts in-process; at 512Mi a long conversation can
            # OOM the pod mid-extract and CrashLoopBackOff. 512Mi/1Gi gives
            # headroom for the in-flight extract without making recall a
            # noticeably heavy tenant. Revisit if we move fact-extraction
            # off the request thread.
            requests:
              memory: 512Mi
              cpu: 100m
            limits:
              memory: 1Gi
              cpu: 500m
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: maki-recall-data
