# Reference manifest — NOT the canonical cluster source of truth.
# The actual cluster deployment is created by Terraform; see
# infra/modules/maki-recall/main.tf. This file is kept as a more
# readable side-by-side reference and as the spec the Terraform
# module is expected to mirror. Drift between the two caused #263:
# the standalone manifest had the #135/#176/#253 fixes; the Terraform
# module did not, so the cluster ran the pre-fix shape with the
# pre-fix image and crashlooped under transient dep outages.
# When you change one, change the other.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: maki-recall-data
  namespace: maki
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: maki-recall
  namespace: maki
  labels:
    app: maki-recall
spec:
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    app: maki-recall
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: maki-recall
  namespace: maki
  labels:
    app: maki-recall
spec:
  replicas: 1
  selector:
    matchLabels:
      app: maki-recall
  template:
    metadata:
      labels:
        app: maki-recall
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: mem0
          image: ghcr.io/adhityaravi/maki-recall:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: POSTGRES_HOST
              value: maki-vault,maki-vault-inu.xantu-city.ts.net,maki-vault-sushi.xantu-city.ts.net,maki-vault-ramen.xantu-city.ts.net
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: maki
            - name: POSTGRES_USER
              value: maki
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: maki-vault-secret
                  key: password
            - name: NEO4J_URI
              value: bolt://maki-graph:7687
            - name: NEO4J_USERNAME
              value: neo4j
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: maki-graph-auth
                  key: password
            - name: OLLAMA_URL
              value: http://maki-embed:11434
            - name: LLM_PROVIDER
              value: openai
            - name: LLM_URL
              value: http://maki-synapse:8080/v1
            - name: LLM_MODEL
              value: claude-sonnet-4-6
            - name: EMBEDDER_MODEL
              value: nomic-embed-text
            - name: EMBEDDING_DIMS
              value: "768"
          # Three-probe split per #253. Previously both readiness and
          # liveness pointed at /health, which returns 503 while Mem0 is
          # still initializing. A slow dep (pgvector/neo4j/synapse) during
          # Memory.from_config would blow past the 240s liveness budget
          # and kubelet would kill the pod mid-init → crashloop.
          #
          #   /live   — process-only; FastAPI loop responsive. Used by
          #             livenessProbe. Never blocks on Mem0/deps.
          #   /health — Mem0 + pgvector + neo4j probes. Used by
          #             readinessProbe (routes traffic only when ready)
          #             and startupProbe (gates liveness until init done).
          startupProbe:
            # 60 × 10s = 10min budget for Mem0 init. Once /health passes
            # once, livenessProbe takes over. Generous because Memory.from_config
            # blocks synchronously on pgvector + neo4j + synapse and any one
            # being slow extends boot.
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            # Process-only probe. Restarts the pod only when the FastAPI
            # event loop itself stops responding — independent of Mem0
            # init state or backend dep health.
            httpGet:
              path: /live
              port: 8000
            initialDelaySeconds: 0
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            # Bumped from 256Mi/512Mi after #251: mem0 fact-extraction runs
            # the LLM add() path synchronously and accumulates messages +
            # extracted facts in-process; at 512Mi a long conversation can
            # OOM the pod mid-extract and CrashLoopBackOff. 512Mi/1Gi gives
            # headroom for the in-flight extract without making recall a
            # noticeably heavy tenant. Revisit if we move fact-extraction
            # off the request thread.
            requests:
              memory: 512Mi
              cpu: 100m
            limits:
              memory: 1Gi
              cpu: 500m
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: maki-recall-data
