apiVersion: v1
kind: Service
metadata:
  name: maki-finbert
  namespace: maki
  labels:
    app: maki-finbert
spec:
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: maki-finbert
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: maki-finbert
  namespace: maki
  labels:
    app: maki-finbert
spec:
  replicas: 1
  selector:
    matchLabels:
      app: maki-finbert
  template:
    metadata:
      labels:
        app: maki-finbert
    spec:
      containers:
        - name: finbert
          image: ghcr.io/adhityaravi/maki-finbert:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
