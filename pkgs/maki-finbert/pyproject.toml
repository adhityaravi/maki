[project]
name = "maki-finbert"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "transformers>=4.47",
    "optimum[onnxruntime]>=1.24",
    "pydantic>=2.0",
]

[project.scripts]
maki-finbert = "maki_finbert.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maki_finbert"]
