name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      common: ${{ steps.filter.outputs.common }}
      cortex: ${{ steps.filter.outputs.cortex }}
      stem: ${{ steps.filter.outputs.stem }}
      ears: ${{ steps.filter.outputs.ears }}
      immune: ${{ steps.filter.outputs.immune }}
      recall: ${{ steps.filter.outputs.recall }}
      synapse: ${{ steps.filter.outputs.synapse }}
      vault: ${{ steps.filter.outputs.vault }}
      any: ${{ steps.filter.outputs.any }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            common:
              - 'pkgs/maki-common/**'
              - 'pyproject.toml'
              - 'uv.lock'
            cortex:
              - 'pkgs/maki-cortex/**'
              - 'pkgs/maki-common/**'
              - 'images/maki-cortex/**'
              - 'pyproject.toml'
              - 'uv.lock'
            stem:
              - 'pkgs/maki-stem/**'
              - 'pkgs/maki-common/**'
              - 'images/maki-stem/**'
              - 'pyproject.toml'
              - 'uv.lock'
            ears:
              - 'pkgs/maki-ears/**'
              - 'pkgs/maki-common/**'
              - 'images/maki-ears/**'
              - 'pyproject.toml'
              - 'uv.lock'
            immune:
              - 'pkgs/maki-immune/**'
              - 'pkgs/maki-common/**'
              - 'images/maki-immune/**'
              - 'pyproject.toml'
              - 'uv.lock'
            recall:
              - 'pkgs/maki-recall/**'
              - 'pkgs/maki-common/**'
              - 'images/maki-recall/**'
              - 'pyproject.toml'
              - 'uv.lock'
            synapse:
              - 'pkgs/maki-synapse/**'
              - 'pkgs/maki-common/**'
              - 'images/maki-synapse/**'
              - 'pyproject.toml'
              - 'uv.lock'
            vault:
              - 'images/maki-vault/**'
            any:
              - '**/*.py'
              - 'pyproject.toml'
              - 'uv.lock'

  lint:
    needs: changes
    if: needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Lint
        run: uvx ruff check pkgs/
      - name: Format check
        run: uvx ruff format --check pkgs/
      - name: Type check
        run: uvx ty check pkgs/

  docker:
    runs-on: ubuntu-latest
    needs: [changes, lint]
    if: >-
      always() && !failure() && !cancelled() &&
      github.event_name == 'push'
    strategy:
      matrix:
        service: [cortex, ears, stem, immune, recall, synapse, vault]
    steps:
      - name: Check if should build
        id: should-build
        run: echo "build=${{ needs.changes.outputs[matrix.service] }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        if: steps.should-build.outputs.build == 'true'

      - name: Log in to GHCR
        if: steps.should-build.outputs.build == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: steps.should-build.outputs.build == 'true'
        run: |
          IMAGE="${{ env.IMAGE_PREFIX }}/maki-${{ matrix.service }}"
          SHA_SHORT="${{ github.sha }}"
          SHA_SHORT="${SHA_SHORT:0:7}"

          docker build \
            --no-cache \
            -f images/maki-${{ matrix.service }}/Dockerfile \
            -t "${IMAGE}:latest" \
            -t "${IMAGE}:sha-${SHA_SHORT}" \
            .

          docker push "${IMAGE}" --all-tags

  status:
    runs-on: ubuntu-latest
    needs: [changes, lint, docker]
    if: always()
    steps:
      - name: Check results
        run: |
          if [ "${{ needs.changes.outputs.any }}" != "true" ]; then
            echo "No changes detected"
            exit 0
          fi

          if [ "${{ needs.lint.result }}" = "failure" ]; then
            echo "::error::Lint checks failed"
            exit 1
          fi

          if [ "${{ needs.docker.result }}" = "failure" ]; then
            echo "::error::Docker build failed"
            exit 1
          fi
